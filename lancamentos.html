<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lançamentos | GUETO Records</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Syncopate:wght@700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <nav class="navbar">
            <div class="logo">GUETO Records</div>
            <ul class="nav-links">
                <li><a href="index.html">Início</a></li>
                <li><a href="artistas.html">Artistas</a></li>
                <li><a href="lancamentos.html" class="active">Lançamentos</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main class="section-container" style="margin-top: 100px;">
        <h2 class="section-title">DROPS DA BANCA</h2>
        
        <div class="grid">
            <div class="card release-card">
                <div class="img-container">
                    <img src="Imagens/rxvxl.jpg" alt="Capa 1">
                    <button class="play-release" 
                            data-src="Musicas/Filipe Ret - Invicto.mp3" 
                            data-title="Invicto" 
                            data-artist="Filipe Ret"
                            data-img="Imagens/rxvxl.jpg" width="100" height="85">
                        OUVIR AGORA
                    </button>
                </div>
                <div class="card-info">
                    <h3>Invicto</h3>
                    <p>Filipe Ret • Album Rxvxl • 2015</p>
                </div>
            </div>

            <div class="card release-card">
                <div class="img-container">
                    <img src="Imagens/penumbra.jpg" alt="Capa 2">
                    <button class="play-release" 
                            data-src="Musicas/penumbra.mp3" 
                            data-title="penumbra" 
                            data-artist="Djonga"
                            data-img="Imagens/penumbra.jpg">
                        OUVIR AGORA
                    </button>
                </div>
                <div class="card-info">
                    <h3>penumbra</h3>
                    <p>Djonga • Album • 2022</p>
                </div>
            </div>

            <div class="card release-card">
                <div class="img-container">
                    <img src="Imagens/Show Bk.webp" alt="Capa 4">
                    <button class="play-release" 
                            data-src="Musicas/BK - Universo.mp3" 
                            data-title="Universo" 
                            data-artist="BK"
                            data-img="Imagens/Show Bk.webp">
                        OUVIR AGORA
                    </button>
                </div>
                <div class="card-info">
                    <h3>Uiverso</h3>
                    <p>BK • Album • 2020</p>
                </div>
            </div>

            <div class="card release-card">
                <div class="img-container">
                    <img src="Imagens/Antes dos gigantes chegarem.jpg" alt="Capa 3">
                    <button class="play-release" 
                            data-src="Musicas/1 - Antes dos Gigantes Chegarem.mp3" 
                            data-title="Antes Dos Gigantes Chegarem" 
                            data-artist="BK"
                            data-img="Imagens/Antes dos gigantes chegarem.jpg">
                        OUVIR AGORA
                    </button>
                </div>
                <div class="card-info">
                    <h3>Antes Dos Gigantes Chegarem</h3>
                    <p>BK • EP • 2017</p>
                </div>
            </div>
        </div>
    </main>

    <div class="custom-player">
        <div class="player-track-info">
            <img id="player-img" src="https://picsum.photos/id/338/60/60?grayscale" alt="Capa">
            <div class="track-details">
                <h4 id="track-name">Selecione uma faixa</h4>
                <p id="track-artist">GUETO Records</p>
            </div>
        </div>
        <div class="player-controls">
            <audio id="audio-track" src=""></audio>
            <button id="play-btn" class="play-btn">▶</button>
            <input type="range" id="progress-bar" value="0" max="100">
        </div>
    </div>

    <script src="teste.js"></script>
</body>
</html>
